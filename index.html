<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f2" />
    <title>ZSCMMR</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="zscmmr/style.css" />
  </head>
  <body class="home">
    <div class="site-shell">
      <header class="site-header">
        <div class="announcement">Independent streetwear · Made to move</div>
        <div class="header-inner">
          <button
            class="menu-toggle"
            type="button"
            aria-controls="preview-navigation"
            aria-expanded="false"
          >
            <span class="menu-toggle-label">Menu</span>
          </button>
          <nav
            class="primary-navigation"
            id="preview-navigation"
            aria-label="Main navigation"
          >
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="gallery.html">Gallery</a></li>
              <li><a href="featured.html">Shop</a></li>
            </ul>
          </nav>
          <div class="site-branding">
            <a class="custom-logo-link" href="./" aria-label="ZSCMMR">
              <img
                class="custom-logo"
                src="zscmmr/assets/images/zscmmr-nav-logo.png"
                alt="ZSCMMR"
              />
            </a>
          </div>
          <div class="header-actions">
            <a class="cart-link" href="cart.html"
              >Bag <span class="cart-count">0</span></a
            >
          </div>
        </div>
      </header>
      <main class="site-main" id="content">
        <figure class="home-banner">
          <a href="featured.html" aria-label="Explore the shop">
            <img
              src="zscmmr/assets/images/zscmmr-banner.png"
              alt="A black ZSCMMR flag flying in front of a building, with a figure wearing streetwear."
              fetchpriority="high"
            />
          </a>
        </figure>
      </main>
      <footer class="site-footer">
        <div class="footer-inner">
          <p>&copy; 2026 ZSCMMR. All rights reserved.</p>
          <p><a href="mailto:nexbyte.wrld@gmail.com">Contact</a></p>
        </div>
      </footer>
    </div>
    <script src="zscmmr/assets/js/navigation.js"></script>
    <script src="zscmmr/assets/js/cart-preview.js"></script>
  </body>
</html>
