<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f5f5f2">
	<title>Checkout — ZSCMMR</title>
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="zscmmr/style.css">
</head>
<body class="featured-page checkout-page">
<div class="site-shell">
	<header class="site-header">
		<div class="header-inner">
			<button class="menu-toggle" type="button" aria-controls="preview-navigation" aria-expanded="false">
				<span class="menu-toggle-label">Menu</span>
			</button>
			<nav class="primary-navigation" id="preview-navigation" aria-label="Main navigation">
				<ul>
					<li><a href="index.html">Home</a></li>
					<li><a href="gallery.html">Gallery</a></li>
					<li><a href="featured.html">Shop</a></li>
				</ul>
			</nav>
			<div class="site-branding">
				<a class="custom-logo-link" href="index.html" aria-label="ZSCMMR">
					<img class="custom-logo" src="zscmmr/assets/images/zscmmr-nav-logo.png" alt="ZSCMMR">
				</a>
			</div>
			<div class="header-actions">
				<a class="cart-link" href="cart.html" aria-current="page">Bag <span class="cart-count">0</span></a>
			</div>
		</div>
	</header>
	<main class="site-main checkout-preview" id="content">
		<div class="checkout-preview-heading">
			<h1>Checkout</h1>
			<a href="cart.html">Back to bag</a>
		</div>
		<div class="checkout-layout">
			<section class="checkout-card" aria-labelledby="checkout-details-heading">
				<h2 id="checkout-details-heading">Delivery details</h2>
				<form class="checkout-form">
					<label>
						<span>Full name</span>
						<input type="text" name="name" placeholder="Your name" required>
					</label>
					<label>
						<span>Email</span>
						<input type="email" name="email" placeholder="you@example.com" required>
					</label>
					<label>
						<span>Phone</span>
						<input type="tel" name="phone" placeholder="+62 8xxxxxxxxxx" required>
					</label>
					<label>
						<span>Address</span>
						<textarea name="address" rows="4" placeholder="Street, city, postal code" required></textarea>
					</label>
				</form>
			</section>
			<aside class="checkout-summary" aria-labelledby="checkout-summary-heading">
				<h2 id="checkout-summary-heading">Order summary</h2>
				<p class="checkout-summary-caption"><span data-checkout-count>0</span> item(s)</p>
				<ul class="checkout-summary-list" data-checkout-list aria-live="polite"></ul>
				<div class="checkout-total-row">
					<span>Total</span>
					<strong data-checkout-total>Price not set</strong>
				</div>
				<button type="button" class="checkout-payment-button" data-pay-button>Pay now</button>
			</aside>
		</div>
	</main>
	<footer class="site-footer">
		<div class="footer-inner">
			<p>&copy; 2026 ZSCMMR. All rights reserved.</p>
			<p>Built for the ones who move different.</p>
			<p><a href="mailto:nexbyte.wrld@gmail.com">Contact</a></p>
		</div>
	</footer>
</div>
<script src="zscmmr/assets/js/navigation.js"></script>
<script src="zscmmr/assets/js/checkout.js"></script>
</body>
</html>
